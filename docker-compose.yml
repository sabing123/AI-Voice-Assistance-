version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: ./compose/local/postgres/Dockerfile
    environment:
      POSTGRES_DB: voice_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_assistant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-cookiecutter-secret-key
      - DB_NAME=voice_assistant_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - AI_API_KEY=${AI_API_KEY:-change-me}
      - STT_API_KEY=${STT_API_KEY:-change-me}
      - TTS_API_KEY=${TTS_API_KEY:-change-me}
      - AI_MODEL=gemini-3.6-flash
      - WHISPER_MODEL_SIZE=base
      - TTS_LANG=en
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
