version: '3.8'

services:
  db:
    container_name: postgres_container
    build:
      context: .
      dockerfile: ./compose/local/postgres/Dockerfile
    env_file:
      - ./.envs/.local/.postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-voice_assistant}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-voice_assistant_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: django_container
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.local/.postgres
      - ./.envs/.local/.django
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
